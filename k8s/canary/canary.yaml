# ══════════════════════════════════════════════════════
#  CANARY DEPLOYMENT
#  Stable gets 90% of traffic, canary gets 10%
#  Achieved via replica ratio (9 stable : 1 canary)
# ══════════════════════════════════════════════════════

# ── Stable (v1 – 9 replicas = ~90% traffic) ──────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 9
  selector:
    matchLabels:
      app: aceest
      track: stable
  template:
    metadata:
      labels:
        app: aceest
        track: stable
    spec:
      containers:
        - name: aceest
          image: tamannabits/aceest-fitness:stable
          ports:
            - containerPort: 5000
---
# ── Canary (v2 – 1 replica = ~10% traffic) ───────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
    spec:
      containers:
        - name: aceest
          image: tamannabits/aceest-fitness:canary
          ports:
            - containerPort: 5000
---
# ── Single Service routes to BOTH (by shared label) ──
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest
spec:
  selector:
    app: aceest # matches both stable + canary pods
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
