# ══════════════════════════════════════════════════════
#  SHADOW DEPLOYMENT
#  All live traffic → stable.  A copy is mirrored to
#  shadow (shadow never sends responses to users).
#  Requires an Ingress controller that supports mirroring
#  (e.g. NGINX with mirror annotation, or Istio VirtualService).
# ══════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      track: shadow
  template:
    metadata:
      labels:
        app: aceest
        track: shadow
    spec:
      containers:
        - name: aceest
          image: tamannabits/aceest-fitness:shadow
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
  namespace: aceest
spec:
  selector:
    app: aceest
    track: shadow
  ports:
    - port: 80
      targetPort: 5000
---
# NGINX Ingress mirror example
# (replace with Istio VirtualService if using a service mesh)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/mirror-uri: "/"
    nginx.ingress.kubernetes.io/mirror-host: "aceest-shadow-service"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service
                port:
                  number: 80
